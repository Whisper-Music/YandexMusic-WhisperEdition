[package]
name = "yandex-desktop"
version = "0.7.0"
description = "Yandex Music — Whisper Edition"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yandex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
md5 = "0.8.1"
keyring = "3"
getrandom = "0.3"
# семафор для тяжёлых загрузок (net.rs::heavy_slot); tokio уже есть в сборке через Tauri
tokio = { version = "1", default-features = false, features = ["sync"] }
# второй запуск приложения не открывает новую копию, а показывает уже запущенное окно
# (в Linux это единственный способ вернуть окно из трея, если в оболочке нет значков трея)
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# ссылки whisper://room/КОД — приглашения в комнату «Слушать вместе» (deeplink.rs)
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
# обновления из GitHub Releases (update.rs): проверка подписи minisign, установка новой версии.
# Без функции «zip»: она нужна только для старого формата обновлений в архивах (.nsis.zip, .AppImage.tar.gz),
# а выпуски собираются в новом формате (createUpdaterArtifacts: true) — сам .exe/.msi/.AppImage.
# Заодно уходит crate zip 4.x с уязвимостями распаковки (RUSTSEC-2026-0367/0368/0369).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }


# режим экономии в трее: доступ к движку окна WebView2 (версии те же, что уже тянет Tauri — ничего нового не скачивается)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Security"] }
# свой звуковой движок (engine.rs, эксклюзивный WASAPI): декодер MP3 / AAC (M4A) / FLAC / WAV, чистый Rust
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "pcm", "wav"] }
keyring = { version = "3", features = ["windows-native"] }

# Unix: O_NOFOLLOW при чтении выбранных файлов (bg.rs) и проверка владельца сокета Discord (discord.rs).
# libc и так приходит с Tauri — новой загрузки нет.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux: токен хранится в системной «связке ключей» (GNOME Keyring / KWallet через Secret Service).
# vendored — libdbus собирается вместе с приложением, отдельный dev-пакет не нужен.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
