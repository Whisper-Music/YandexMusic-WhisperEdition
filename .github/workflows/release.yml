name: release
# Запуск: вручную (Actions → release → Run workflow) или тегом vX.Y.Z.
# Когда публикуешь черновик выпуска, GitHub сам создаёт тег vX.Y.Z — и это тоже «push тега». Такой запуск
# ничего не собирает (выпуск уже опубликован) и завершается без ошибки, см. guard.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Проверка перед сборкой: версия одинакова в tauri.conf.json, package.json и Cargo.toml,
  # и опубликованного релиза с таким тегом ещё нет. Иначе tauri-action молча зальёт файлы
  # в уже вышедший релиз вместо создания черновика (так случилось с v0.6.0).
  guard:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Версия и существующий релиз
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          # обычно tauri.conf.json берёт версию из package.json ("../package.json") — главная версия там
          if [ "$conf" = "../package.json" ]; then conf="$pkg"; fi
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          echo "tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::Версии не совпадают: tauri.conf.json=$conf, package.json=$pkg, Cargo.toml=$cargo"
            exit 1
          fi
          tag="v$conf"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с версией приложения ($tag)"
            exit 1
          fi
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          # тег появился, потому что выпуск только что опубликовали — собирать нечего
          if [ "$draft" = "false" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "::notice::Выпуск $tag уже опубликован — тег создан публикацией, сборка не нужна"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$draft" = "false" ]; then
            echo "::error::Релиз $tag уже опубликован. Подними версию (npm run version X.Y.Z) и запусти снова."
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            echo "::notice::Черновик $tag уже есть — сборки будут добавлены в него"
          fi
          echo "version=$conf" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest          # x64
            target: ''
          - os: windows-latest          # x86 (32 бита)
            target: i686-pc-windows-msvc
          - os: ubuntu-22.04
            target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }      # ядро Whisper (src/core) — подмодуль whisper-core
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # выпуски — с полным LTO (меньше и быстрее бинарник); в Cargo.toml профиль облегчён для локальной сборки
          CARGO_PROFILE_RELEASE_LTO: 'true'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
        with:
          tagName: v__VERSION__
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          releaseName: 'Yandex Music Whisper Edition v__VERSION__'
          releaseBody: 'Что нового — допиши перед публикацией.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true          # latest.json — по нему приложение находит обновление (подписи внутри)
          uploadUpdaterSignatures: false   # отдельные .sig в выпуске не нужны: те же подписи уже в latest.json
          updaterJsonPreferNsis: true      # обновлять установщиком setup.exe (NSIS), а не .msi

  # Android: APK для arm64 (почти все телефоны с 2017 года), подписанный одним ключом выпусков — иначе новая
  # версия не встанет поверх старой. Ключ — в секретах ANDROID_KEYSTORE_BASE64 (файл .jks в base64) и
  # ANDROID_KEYSTORE_PASSWORD (пароль хранилища и ключа, псевдоним — whisper). Ждёт build: черновик выпуска
  # создаёт tauri-action, сюда APK только докладывается.
  android:
    needs: [guard, build]
    if: needs.guard.outputs.skip != 'true' && !cancelled()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: NDK
        shell: bash
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Нет секретов ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD — без подписи APK не установится"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/whisper-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=whisper\n' \
            "$RUNNER_TEMP/whisper-release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties

      - run: npm ci
      - run: npx tauri android build --apk --target aarch64 --ci

      - name: APK в выпуск
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VER"
          apk="Yandex.Music.Whisper.Edition_${VER}_android_arm64.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          # черновик обычно уже создан сборкой для компьютера; если она упала целиком — создаём сами
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "Yandex Music Whisper Edition $tag" --notes "Что нового — смотри коммиты."
          gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber

  # Убрать .sig из черновика выпуска. У tauri-action@v0 параметр uploadUpdaterSignatures не срабатывает (в README он
  # описан для @v1) — подписи всё равно заливались файлами. Обновлению они не нужны: те же подписи лежат внутри
  # latest.json, а он остаётся. Работает после всех сборок, когда в выпуске уже всё лежит.
  strip-signatures:
    needs: [guard, build]
    if: needs.guard.outputs.skip != 'true' && !cancelled()
    runs-on: ubuntu-22.04
    steps:
      - name: Удалить .sig из выпуска
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(endswith(".sig"))' || true)
          if [ -z "$names" ]; then echo "::notice::В $TAG нет .sig — удалять нечего"; exit 0; fi
          while IFS= read -r n; do
            echo "удаляю $n"
            gh release delete-asset "$TAG" "$n" --repo "$GITHUB_REPOSITORY" --yes
          done <<< "$names"
