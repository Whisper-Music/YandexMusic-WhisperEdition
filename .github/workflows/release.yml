name: release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Проверка перед сборкой: версия одинакова в tauri.conf.json, package.json и Cargo.toml,
  # и опубликованного релиза с таким тегом ещё нет. Иначе tauri-action молча зальёт файлы
  # в уже вышедший релиз вместо создания черновика (так случилось с v0.6.0).
  guard:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Версия и существующий релиз
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          echo "tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::Версии не совпадают: tauri.conf.json=$conf, package.json=$pkg, Cargo.toml=$cargo"
            exit 1
          fi
          tag="v$conf"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с версией приложения ($tag)"
            exit 1
          fi
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "::error::Релиз $tag уже опубликован. Подними версию (tauri.conf.json, package.json, Cargo.toml + cargo update -p yandex-desktop) и запусти снова."
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            echo "::notice::Черновик $tag уже есть — сборки будут добавлены в него"
          fi
          echo "version=$conf" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest          # x64
            target: ''
          - os: windows-latest          # x86 (32 бита)
            target: i686-pc-windows-msvc
          - os: ubuntu-22.04
            target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          releaseName: 'Yandex Music Whisper Edition v__VERSION__'
          releaseBody: 'Что нового — допиши перед публикацией.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true          # latest.json — по нему приложение находит обновление (подписи внутри)
          uploadUpdaterSignatures: false   # отдельные .sig в выпуске не нужны: те же подписи уже в latest.json
          updaterJsonPreferNsis: true      # обновлять установщиком setup.exe (NSIS), а не .msi
